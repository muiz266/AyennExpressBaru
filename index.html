<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#00B14F">
    <title>Ketam Nipah | Sistem Tempahan Ayenn Express</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --grab-green: #00B14F;
            --white: #ffffff;
            --bg: #f5f5f5;
            --bg-alt: #fafafa;
            --card: #ffffff;
            --border: #e8e8e8;
            --border-light: #f0f0f0;
            --text-dark: #1a1a1a;
            --text-body: #333333;
            --text-secondary: #666666;
            --text-muted: #999999;
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-glow: 0 6px 20px rgba(0, 177, 79, 0.35);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-pill: 50px;
            --font: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: var(--font); 
            background: var(--bg); 
            color: var(--text-body); 
            line-height: 1.5; 
            min-height: 100vh; 
            padding-bottom: 140px; 
            position: relative;
        }
        
        .status-bar { position: sticky; top: 0; z-index: 1000; background: var(--grab-green); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
        .status-left { display: flex; align-items: center; gap: 10px; }
        .status-indicator { width: 10px; height: 10px; border-radius: 50%; background: #ffffff; animation: statusPulse 2s ease-in-out infinite; }
        @keyframes statusPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(0.85); } }
        .status-text { color: #ffffff; font-size: 14px; font-weight: 700; }
        .status-badge { background: rgba(255,255,255,0.2); color: #ffffff; padding: 4px 12px; border-radius: var(--radius-pill); font-size: 11px; font-weight: 700; }
        
        .earnings-header { background: var(--white); padding: 20px; border-bottom: 1px solid var(--border); }
        .earnings-top { display: flex; justify-content: space-between; align-items: center; }
        .earnings-greeting { font-size: 13px; color: var(--text-muted); font-weight: 600; }
        .earnings-title { font-size: 22px; font-weight: 900; color: var(--text-dark); margin-top: 2px; }
        .earnings-avatar { width: 44px; height: 44px; border-radius: 50%; background: #e6f9ef; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; color: var(--grab-green); border: 2px solid var(--grab-green); }
        
        .main-content { max-width: 540px; margin: 0 auto; padding: 16px; position: relative; z-index: 1; }
        .nav-tabs { display: flex; gap: 8px; margin-bottom: 16px; background: var(--white); padding: 6px; border-radius: var(--radius-md); border: 1px solid var(--border); }
        .tab-btn { flex: 1; padding: 12px; background: transparent; border: none; color: var(--text-secondary); font-family: var(--font); font-size: 13px; font-weight: 700; cursor: pointer; border-radius: var(--radius-sm); text-align: center; }
        .tab-btn.active { background: var(--grab-green); color: #ffffff; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        
        .card { background: var(--card); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding: 20px; margin-bottom: 16px; border: 1px solid var(--border-light); }
        .section-title { font-size: 13px; font-weight: 800; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 12px; }
        
        .product-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 16px; }
        .product-option { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: var(--bg-alt); border: 2px solid var(--border); border-radius: var(--radius-md); cursor: pointer; pointer-events: auto !important; position: relative; z-index: 5; }
        .product-option.selected { border-color: var(--grab-green); background: #f0fdf4; }
        .product-info h4 { font-size: 14px; font-weight: 800; color: var(--text-dark); }
        .product-info p { font-size: 12px; color: var(--text-muted); }
        .product-price { font-size: 16px; font-weight: 900; color: var(--grab-green); }
        
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 13px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; }
        .form-input { width: 100%; padding: 12px 16px; background: var(--bg-alt); border: 2px solid var(--border); border-radius: var(--radius-md); font-family: var(--font); font-size: 14px; font-weight: 600; color: var(--text-dark); pointer-events: auto !important; position: relative; z-index: 5; }
        
        .summary-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; font-size: 13px; font-weight: 600; color: var(--text-secondary); }
        .summary-row.total { border-top: 2px dashed var(--border); margin-top: 8px; padding-top: 12px; font-size: 16px; font-weight: 900; color: var(--text-dark); }
        .summary-row.total .total-price { color: var(--grab-green); font-size: 20px; }
        
        .checkout-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--white); padding: 16px 20px; box-shadow: 0 -4px 20px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: space-between; z-index: 999; border-top: 1px solid var(--border); }
        .checkout-info span { font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; display: block; }
        .checkout-info h3 { font-size: 18px; font-weight: 900; color: var(--text-dark); }
        .checkout-btn { background: linear-gradient(135deg, #00B14F 0%, #008038 100%); color: #ffffff; border: none; padding: 14px 28px; border-radius: var(--radius-md); font-family: var(--font); font-size: 14px; font-weight: 800; cursor: pointer; box-shadow: var(--shadow-glow); pointer-events: auto !important; position: relative; z-index: 1000; }
        
        .action-btn-sm { background: #e6f9ef; color: var(--grab-green); border: 1px solid var(--grab-green); padding: 8px 16px; border-radius: var(--radius-sm); font-family: var(--font); font-size: 12px; font-weight: 800; cursor: pointer; margin-top: 10px; display: inline-block; pointer-events: auto !important; }
        .result-msg { margin-top: 12px; font-weight: 800; text-align: center; font-size: 14px; }
    </style>
</head>
<body>

    <div class="status-bar">
        <div class="status-left">
            <div class="status-indicator"></div>
            <span class="status-text">Sistem Online</span>
        </div>
        <div class="status-right">
            <span class="status-badge">AYENN EXPRESS</span>
        </div>
    </div>

    <div class="earnings-header">
        <div class="earnings-top">
            <div>
                <div class="earnings-greeting">Selamat Datang,</div>
                <div class="earnings-title">Ketam Nipah Segar</div>
            </div>
            <div class="earnings-avatar">A</div>
        </div>
    </div>

    <div class="main-content">
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('orderTab', this)">Borang Tempahan</button>
            <button class="tab-btn" onclick="switchTab('trackTab', this)">Semak Status</button>
        </div>

        <div id="orderTab" class="tab-panel active">
            <form id="orderForm">
                <div class="card">
                    <div class="section-title">Pilih Saiz Ketam</div>
                    <div class="product-grid">
                        <label class="product-option selected">
                            <div class="product-info">
                                <h4>Ketam Nipah Saiz L (Standard)</h4>
                                <p>Isi padat & segar</p>
                            </div>
                            <div class="product-price">RM 38.00</div>
                            <input type="radio" name="product" value="Ketam Nipah Saiz L" checked style="display:none;">
                        </label>
                        <label class="product-option">
                            <div class="product-info">
                                <h4>Ketam Nipah Saiz XL (Jumbo)</h4>
                                <p>Saiz besar & bermutu tinggi</p>
                            </div>
                            <div class="product-price">RM 48.00</div>
                            <input type="radio" name="product" value="Ketam Nipah Saiz XL" style="display:none;">
                        </label>
                    </div>
                </div>

                <div class="card">
                    <div class="section-title">Maklumat Pelanggan & Pembayaran</div>
                    <div class="form-group">
                        <label class="form-label">Nama Penuh</label>
                        <input type="text" class="form-input" id="customerName" placeholder="Cth: Ayenn" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Alamat Penghantaran</label>
                        <input type="text" class="form-input" id="address" placeholder="Cth: Ambangan Heights, Sungai Petani" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Muat Naik Resit DuitNow / TNG</label>
                        <input type="file" class="form-input" id="receiptFile" accept="image/*" required>
                    </div>
                </div>

                <div class="card">
                    <div class="section-title">Ringkasan Bayaran</div>
                    <div class="summary-row">
                        <span>Harga Produk</span>
                        <span id="summaryPrice">RM 38.00</span>
                    </div>
                    <div class="summary-row total">
                        <span>Jumlah Keseluruhan</span>
                        <span class="total-price" id="summaryTotal">RM 38.00</span>
                    </div>
                </div>
            </form>
            <div id="orderResult" class="result-msg"></div>
        </div>

        <div id="trackTab" class="tab-panel">
            <div class="card">
                <div class="section-title">Semak Status Pesanan</div>
                <div class="form-group">
                    <label class="form-label">Masukkan ID Pesanan</label>
                    <input type="text" class="form-input" id="orderIdInput" placeholder="Cth: SP-XXXX">
                </div>
                <button type="button" class="checkout-btn" style="width:100%; margin-top:4px;" onclick="checkStatus()">Semak Sekarang</button>
                <div id="statusResult" class="result-msg"></div>
            </div>
        </div>
    </div>

    <div class="checkout-bar" id="checkoutBar">
        <div class="checkout-info">
            <span>Jumlah Bayaran</span>
            <h3 id="barTotal">RM 38.00</h3>
        </div>
        <button type="button" class="checkout-btn" onclick="document.getElementById('orderForm').requestSubmit()">Hantar Tempahan</button>
    </div>

<script>
    // URL Rasmi Backend di Render yang terkini
    const BACKEND_URL = 'https://ayennexpressbaru.onrender.com';
    
    // URL Webhook Make.com Ayenn
    const MAKE_WEBHOOK_URL = 'https://hook.eu1.make.com/7atp9o1pksv82qxl385w68zj9w2g675n';

    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
        document.getElementById('checkoutBar').style.display = (tabId === 'orderTab') ? 'flex' : 'none';
    }

    const options = document.querySelectorAll('.product-option');
    options.forEach(opt => {
        opt.addEventListener('click', () => {
            options.forEach(o => o.classList.remove('selected'));
            opt.classList.add('selected');
            const radio = opt.querySelector('input[type="radio"]');
            radio.checked = true;
            const price = radio.value.includes('XL') ? 'RM 48.00' : 'RM 38.00';
            document.getElementById('summaryPrice').innerText = price;
            document.getElementById('summaryTotal').innerText = price;
            document.getElementById('barTotal').innerText = price;
        });
    });

    let lastGeneratedId = '';

    document.getElementById('orderForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const selectedRadio = document.querySelector('input[name="product"]:checked');
        const productName = selectedRadio ? selectedRadio.value : 'Ketam Nipah Saiz L';
        const customerName = document.getElementById('customerName').value;
        const address = document.getElementById('address').value;
        const receiptInput = document.getElementById('receiptFile');
        const resultDiv = document.getElementById('orderResult');

        if (receiptInput.files.length === 0) {
            resultDiv.style.color = 'red';
            resultDiv.innerText = 'Sila muat naik resit pembayaran!';
            return;
        }

        const orderId = 'SP-' + Math.floor(1000 + Math.random() * 9000);
        lastGeneratedId = orderId;
        const totalPrice = productName.includes('XL') ? 'RM 48.00' : 'RM 38.00';

        const formData = new FormData();
        formData.append('orderId', orderId);
        formData.append('productName', productName);
        formData.append('customerName', customerName);
        formData.append('address', address);
        formData.append('totalPrice', totalPrice);
        formData.append('receipt', receiptInput.files[0]);

        resultDiv.style.color = '#666';
        resultDiv.innerText = 'AI sedang menyemak kesahihan resit...';

        fetch(MAKE_WEBHOOK_URL, {
            method: 'POST',
            body: formData
        })
        .then(async response => {
            let responseText = await response.text();
            try {
                const jsonObj = JSON.parse(responseText);
                if (jsonObj.status) responseText = jsonObj.status;
            } catch (err) {}
            
            const isRejected = /TOLAK|REJECT|TIDAK SAH|GAGAL/i.test(responseText);
            let aiStatus = isRejected ? 'DITOLAK' : 'DITERIMA & DALAM PROSES';
            let aiReason = responseText || 'Resit tidak sah atau bukan resit pembayaran.';

            fetch(`${BACKEND_URL}/update-status`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ orderId, status: aiStatus, reason: aiReason })
            }).catch(err => console.log('Gagal hantar ke backend'));

            if (aiStatus === 'DITOLAK') {
                resultDiv.style.color = 'red';
                resultDiv.innerHTML = `Pesanan DITOLAK Automatik oleh AI!<br><span style="font-size:12px; font-weight:normal;">Sebab: ${aiReason}</span><br><button type="button" class="action-btn-sm" onclick="copyOrderId()">Salin ID Pesanan</button>`;
            } else {
                resultDiv.style.color = '#00B14F';
                resultDiv.innerHTML = `Berjaya! Resit Sah. ID Pesanan: ${orderId}<br><button type="button" class="action-btn-sm" onclick="copyOrderId()">Salin ID Pesanan</button>`;
            }
            
            document.getElementById('orderForm').reset();
        })
        .catch(error => {
            resultDiv.style.color = 'red';
            resultDiv.innerText = 'Ralat sambungan. Sila cuba lagi.';
        });
    });

    function copyOrderId() {
        if (lastGeneratedId) {
            navigator.clipboard.writeText(lastGeneratedId);
            alert('ID ' + lastGeneratedId + ' berjaya disalin!');
        }
    }

    async function checkStatus() {
        const id = document.getElementById('orderIdInput').value.trim();
        const resultDiv = document.getElementById('statusResult');
        
        if (!id) {
            resultDiv.style.color = 'red';
            resultDiv.innerText = 'Sila masukkan ID pesanan!';
            return;
        }

        resultDiv.style.color = '#666';
        resultDiv.innerText = 'Sedang menyemak...';
        try {
            const response = await fetch(`${BACKEND_URL}/check-status/${id}`);
            const data = await response.json();
            
            if (response.ok) {
                let statusHTML = '';
                if (data.status === 'DITOLAK') {
                    statusHTML = `
                        <div style="background: #ffebee; border-left: 5px solid #f44336; padding: 15px; border-radius: var(--radius-md); margin-top: 12px; text-align: left; border: 1px solid #ffcdd2;">
                            <p style="color: #c62828; font-weight: 900; margin-bottom: 6px;">Status: DITOLAK / TIDAK SAH</p>
                            <p style="font-size: 13px; color: #333; margin-bottom: 6px;"><strong>Sebab:</strong> ${data.reason}</p>
                        </div>
                    `;
                } else {
                    statusHTML = `
                        <div style="background: var(--bg-alt); padding: 15px; border-radius: var(--radius-md); margin-top: 12px; text-align: left; border: 1px solid var(--border);">
                            <p style="margin-bottom: 6px;"><strong>ID:</strong> ${data.orderId}</p>
                            <p style="margin-bottom: 6px;"><strong>Status:</strong> <span style="color: var(--grab-green); font-weight: 800;">${data.status}</span></p>
                        </div>
                    `;
                }
                resultDiv.innerHTML = statusHTML;
            } else {
                resultDiv.style.color = 'red';
                resultDiv.innerText = 'ID Pesanan tidak dijumpai.';
            }
        } catch (err) {
            resultDiv.style.color = 'red';
            resultDiv.innerText = 'Pelayan tidak dijumpai. Pastikan sistem aktif.';
        }
    }
</script>
</body>
</html>
